<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Web Chat Advanced</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: sans-serif; 
            padding: 0; 
            margin: 0; 
            background-color: #121212; 
            color: white; 
            height: 100vh;
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            transition: background-color 0.3s, color 0.3s;
        }
        
        #login-form { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; position: absolute; top: 0; left: 0; background-color: #121212; z-index: 1000; padding: 20px; }
        #login-form input, #login-form button { width: 100%; max-width: 300px; margin-bottom: 15px; padding: 10px; border-radius: 20px; border: 1px solid #ccc; background-color: #1e1e1e; color: white;}
        
        #chat-area { display: none; flex-direction: column; width: 100%; height: 100%; }
        
        #chat-header { 
            padding: 10px; 
            background-color: #1e1e1e; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid #333; 
            height: 50px; 
            flex-shrink: 0; 
            position: relative;
        }
        
        /* Posisi Tombol Tengah */
        #header-center {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
        }
        #theme-toggle { 
            background-color: #f0ad4e; /* Warna default (mode gelap: matahari) */
            color: white; 
            border: none; 
            padding: 5px 10px; 
            border-radius: 10px; 
            cursor: pointer; 
            font-size: 16px;
            width: 40px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s;
        }

        /* Warna saat mode terang */
        body.light-mode #theme-toggle {
            background-color: #333; /* Warna saat mode terang: bulan */
        }

        #logout-btn { background-color: #ff4500; color: white; border: none; padding: 5px 10px; border-radius: 10px; cursor: pointer; font-size: 12px; }

        /* Chatbox scrollable */
        #chatbox { 
            flex: 1; 
            overflow-y: auto; 
            padding: 10px; 
            display: flex;
            flex-direction: column;
            background-color: #121212;
            padding-bottom: 20px;
        }
        
        .message { margin-bottom: 15px; display: flex; align-items: flex-start; }
        
        /* ADMIN Profile */
        .profile-pic { width: 35px; height: 35px; border-radius: 50%; margin-right: 10px; object-fit: cover; flex-shrink: 0; }
        .admin-pic { opacity: 0.4 !important; filter: grayscale(50%); }                

        .message-content { display: flex; flex-direction: column; max-width: calc(100% - 50px); }
        .message-bubble { 
            padding: 8px 12px; 
            border-radius: 15px; 
            background-color: #333; 
            margin-top: 5px; 
            word-wrap: break-word;
            color: white;
        }
        .file-attachment { max-width: 200px; border-radius: 10px; margin-top: 5px; }
        .audio-player { margin-top: 5px; max-width: 250px; }
        
        /* Input Area */
        .input-area { 
            background-color: #1e1e1e; 
            display: flex; 
            align-items: center; 
            padding: 10px; 
            border-top: 1px solid #333;
            flex-shrink: 0;
            padding-bottom: 50px; 
        }                
        input, select, button { padding: 10px; margin: 5px; border-radius: 20px; border: none; outline: none; }
        input[type="text"] { flex: 1; background-color: #333; color: white; min-width: 0; }
        #send-btn, #mic-btn { background-color: #007bff; color: white; cursor: pointer; border: none; padding: 10px 15px; flex-shrink: 0; }
        #mic-btn.recording { background-color: #ff0000; animation: pulse 1.5s infinite; }
        
        #typing { color: gray; font-style: italic; padding: 5px 10px; font-size: 12px; height: 15px; background: #121212; }
        
        /* ADMIN Warna RGB */
        .admin-name {
            font-weight: bold;
            background: linear-gradient(to right, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: rainbow 3s linear infinite;
            background-size: 300% auto;
            text-shadow: 0 0 5px rgba(255,255,255,0.3);
        }

        @keyframes rainbow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* --- Gaya Tema Terang (Light Mode) --- */
        body.light-mode { background-color: #f4f4f4; color: #333; }
        body.light-mode #chat-header, body.light-mode .input-area { background-color: #f0f0f0; border-bottom: 1px solid #ccc; }
        body.light-mode #chatbox { background-color: #ffffff; }
        body.light-mode .message-bubble { background-color: #e1e1e1; color: #333; }
        body.light-mode input[type="text"] { background-color: #fff; color: #333; }
        body.light-mode #typing { background-color: #ffffff; }
    </style>
</head>
<body>

    <div id="login-form">
        <h3>Masuk Chat</h3>
        <input type="text" id="username" placeholder="Nama Anda" />
        <label>Warna Nama:</label>
        <input type="color" id="color" value="#00bfff" />
        <label>Foto Profil:</label>
        <input type="file" id="profilePicInput" accept="image/*" />
        <button onclick="startChat()">Masuk</button>
    </div>

    <div id="chat-area">
        <div id="chat-header">
            <span id="header-username"></span>
            
            <div id="header-center">
                <button id="theme-toggle" onclick="toggleTheme()">🌙</button>
            </div>

            <button id="logout-btn" onclick="logout()">Logout</button>
        </div>
        
        <div id="chatbox"></div>
        <div id="typing"></div>
        
        <div class="input-area">
            <label for="fileInput" style="cursor:pointer; font-size:20px; margin-right:10px;">📎</label>
            <input type="file" id="fileInput" accept="image/*,audio/*,video/*" style="display:none;" onchange="sendFile(this)" />
            <input type="text" id="message" placeholder="Ketik pesan..." onkeypress="sendTyping()" />
            <button id="mic-btn">🎤</button>
            <button id="send-btn" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        // --- FIX JS: Paksa tinggi layar ---
        function setHeight() {
            let h = window.innerHeight;
            document.body.style.height = h + "px";
            document.getElementById('login-form').style.height = h + "px";
            document.getElementById('chat-area').style.height = h + "px";
        }
        
        window.addEventListener('resize', setHeight);
        setHeight();
        // -----------------------------------

        const socket = io();
        const chatbox = document.getElementById('chatbox');
        const typingDiv = document.getElementById('typing');
        const micBtn = document.getElementById('mic-btn');
        const themeBtn = document.getElementById('theme-toggle');
        let currentUsername = localStorage.getItem('chatUsername') || "";
        let currentColor = localStorage.getItem('chatColor') || "#00bfff";
        let currentProfilePic = localStorage.getItem('chatPic') || "/uploads/default.png";

        // Cek apakah sudah login sebelumnya (Session Alternative)
        if (currentUsername) {
            enterChat();
        }

        // Logika Tema (Toggle)
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            
            // Simpan preferensi
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
            
            // Update ikon dan warna tombol
            updateThemeButton(isLight);
        }

        // Update tampilan tombol tema
        function updateThemeButton(isLight) {
            if (isLight) {
                themeBtn.innerText = "☀️"; // Logo matahari untuk mode terang
            } else {
                themeBtn.innerText = "🌙"; // Logo bulan untuk mode gelap
            }
        }

        // Load tema saat aplikasi dibuka
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-mode');
            updateThemeButton(true);
        } else {
            updateThemeButton(false);
        }

        async function startChat() {
            const usernameInput = document.getElementById('username').value;
            const colorInput = document.getElementById('color').value;
            const fileInput = document.getElementById('profilePicInput');
            if(!usernameInput) return alert("Isi nama!");
            
            // --- KODE BARU BUAT PASSWORD ---
            let password = "";
            if (usernameInput === "Admin") {
                password = prompt("Masukkan Password Admin:");
                if (password === null) return; // Kalau cancel, batalin login
            }
            // -------------------------------

            currentUsername = usernameInput;
            currentColor = colorInput;
            
            if(fileInput.files[0]) {
                const formData = new FormData();
                formData.append('file', fileInput.files[0]);
                const response = await fetch('/upload-profile', { method: 'POST', body: formData });
                currentProfilePic = await response.text();
            } else {
                currentProfilePic = "/uploads/default.png";
            }
            
            // Simpan sesi
            localStorage.setItem('chatUsername', currentUsername);
            localStorage.setItem('chatColor', currentColor);
            localStorage.setItem('chatPic', currentProfilePic);
            
            // --- KODE BARU: Kirim password ---
            enterChat(password);
        }

        // --- KODE BARU: Sekarang fungsi ini menerima password ---
        function enterChat(password = "") {
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('chat-area').style.display = 'flex';
            document.getElementById('header-username').innerText = currentUsername;
            
            // Kirim username dan password ke server
            socket.emit('register user', { username: currentUsername, password: password });
            
            setHeight();
        }

        function logout() {
            // Hapus sesi
            localStorage.removeItem('chatUsername');
            localStorage.removeItem('chatColor');
            localStorage.removeItem('chatPic');
            location.reload();
        }

        function sendMessage() {
            const msgInput = document.getElementById('message');
            if(!msgInput.value) return;
            socket.emit('chat message', { name: currentUsername, color: currentColor, pic: currentProfilePic, msg: msgInput.value, type: 'text' });
            msgInput.value = '';
            socket.emit('stop typing');
        }

        async function sendFile(input) {
            if(!input.files[0]) return;
            const formData = new FormData();
            formData.append('file', input.files[0]);
            formData.append('name', currentUsername);
            formData.append('color', currentColor);
            formData.append('pic', currentProfilePic);
            await fetch('/upload-file', { method: 'POST', body: formData });
            input.value = '';
        }

        let mediaRecorder;
        let audioChunks = [];

        async function initRecorder() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = (event) => { audioChunks.push(event.data); };
                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                    const formData = new FormData();
                    formData.append('file', audioBlob, 'voice-message.mp3');
                    formData.append('name', currentUsername);
                    formData.append('color', currentColor);
                    formData.append('pic', currentProfilePic);
                    await fetch('/upload-file', { method: 'POST', body: formData });
                    audioChunks = [];
                };
            } catch (err) { console.error("Gagal mikrofon", err); }
        }

        function startRecording() {
            if(!mediaRecorder) return;
            audioChunks = [];
            mediaRecorder.start();
            micBtn.classList.add('recording');
        }

        function stopRecording() {
            if(mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.stop();
                micBtn.classList.remove('recording');
            }
        }

        micBtn.addEventListener('mousedown', startRecording);
        micBtn.addEventListener('mouseup', stopRecording);
        micBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startRecording(); });
        micBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopRecording(); });
        initRecorder();

        function displayMessage(data) {
            const div = document.createElement('div');
            div.className = 'message';
            
            let content = "";
            if(data.type === 'text') { content = `<div class="message-bubble">${data.msg}</div>`; } 
            else if(data.type === 'image') { content = `<img src="${data.url}" class="file-attachment" />`; } 
            else if(data.type === 'audio') { content = `<audio controls class="audio-player" src="${data.url}"></audio>`; } 
            else if(data.type === 'file') { content = `<a href="${data.url}" target="_blank" style="color:#00bfff;">📄 Download ${data.fileName}</a>`; }

            const isAdmin = data.name === 'Admin';
            const picClass = isAdmin ? 'profile-pic admin-pic' : 'profile-pic';
            const nameClass = isAdmin ? 'admin-name' : '';
            const nameStyle = isAdmin ? '' : `color: ${data.color};`;

            div.innerHTML = `
                <img src="${data.pic}" class="${picClass}" />
                <div class="message-content">
                    <span class="${nameClass}" style="${nameStyle} font-weight:bold;">${data.name}</span>
                    ${content}
                </div>
            `;
            chatbox.appendChild(div);
            chatbox.scrollTop = chatbox.scrollHeight;
        }

        socket.on('chat message', (data) => { displayMessage(data); });
        socket.on('load history', (history) => { history.forEach(data => displayMessage(data)); });
        socket.on('clear chat', () => { chatbox.innerHTML = ''; });
        socket.on('kick user', (username) => { if (currentUsername === username) { logout(); } });

        let typingTimer;
        function sendTyping() {
            socket.emit('typing', currentUsername);
            clearTimeout(typingTimer);
            typingTimer = setTimeout(() => { socket.emit('stop typing'); }, 1000);
        }
        socket.on('typing', (user) => { typingDiv.innerText = `${user} sedang mengetik...`; });
        socket.on('stop typing', () => { typingDiv.innerText = ''; });
    </script>
</body>
</html>
